name: Trusted PR gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Fetch PR head without executing it
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: Require independent approval for critical changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_SHA: ${{ vars.PAW_APPROVED_CHANGE_REF }}
        run: python scripts/guard_pr_change.py --base "$BASE_SHA" --head "$HEAD_SHA" --approved "$APPROVED_SHA"
