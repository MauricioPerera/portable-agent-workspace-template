name: Validate workspace template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate OKF nodes
        run: python scripts/validate_okf_nodes.py
      - name: Validate clean template
        run: python scripts/validate_template.py
      - name: Test prompt, scaffold and negative regressions
        run: python -m unittest discover -s tests -v
