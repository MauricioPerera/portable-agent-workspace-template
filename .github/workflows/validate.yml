name: Validate workspace template

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate OKF nodes
        run: python scripts/validate_okf_nodes.py
      - name: Validate clean template
        run: python scripts/validate_template.py
      - name: Test scaffold
        run: python -m unittest tests.test_init_workspace
